name: Lab 6 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ "20.x", "22.x" ]

    defaults:
      run:
        working-directory: Lab-1/Lab-6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab6-package-node-${{ matrix.node-version }}
          path: Lab-1/Lab-6/dist/
